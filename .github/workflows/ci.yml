name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  integration:
    name: Integration tests (docker-compose)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services (docker compose)
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
        run: |
          # ensure docker compose is available and build containers
          docker compose up --build -d

      - name: Wait for API to be healthy
        run: |
          set -e
          for i in {1..30}; do
            if curl -sSf http://localhost:8000/api/v1/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i/30)"
            sleep 2
          done
          echo "API did not become available in time" >&2
          docker compose logs
          exit 1

      - name: Install test requirements inside runner
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run integration test script
        run: python integration_test_http.py

      - name: Run load test (optional)
        run: python load_test.py

      - name: Tear down
        if: always()
        run: docker compose down --remove-orphans